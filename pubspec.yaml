name: healthmate
description: "HealthMate - a personal health & wellness tracker built with Flutter and Provider (MVVM)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # State management (MVVM view models exposed with ChangeNotifier / ProxyProvider)
  provider: ^6.1.5
  # Date and number formatting (e.g. "18 August 2026", "7,850")
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Alexandria font (SIL Open Font License – see assets/fonts/OFL.txt).
  # Bundled with the app so it works offline.
  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/fonts/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Alexandria-Bold.ttf
          weight: 700
        - asset: assets/fonts/Alexandria-ExtraBold.ttf
          weight: 800
