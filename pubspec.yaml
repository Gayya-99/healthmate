name: healthmate
description: "HealthMate - a personal health & wellness tracker built with Flutter, Provider and SQLite."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # State management (HealthController is a ChangeNotifier provided to all screens)
  provider: ^6.1.5
  # SQLite database (stores health records on the device)
  sqflite: ^2.4.2
  # Builds the database file path in a platform-safe way
  path: ^1.9.1
  # Date and number formatting (e.g. "18 August 2026", "7,850")
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Runs the same SQLite code in unit/widget tests on your PC
  sqflite_common_ffi: ^2.3.6

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Alexandria font (SIL Open Font License – see assets/fonts/OFL.txt).
  # Bundled with the app so it works offline.
  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/fonts/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Alexandria-Bold.ttf
          weight: 700
        - asset: assets/fonts/Alexandria-ExtraBold.ttf
          weight: 800
